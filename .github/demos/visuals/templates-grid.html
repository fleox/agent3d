<!doctype html>
<!-- Rendered with: node shot.mjs "file://$PWD/templates-grid.html?dir=<folder of <template-id>.png>" out.png --size 1800x1138 --scale 1, then JPG q85 -> ../../assets/templates-grid.jpg. Images: `agent3d render --frames <60% of the timeline, else 3> --size 960x540 --quality high` per template (published CLI). -->
<html lang="en"><head><meta charset="utf-8"><title>Agent3D templates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0c10}
body{width:1800px;font-family:Inter,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#f2f4f8;-webkit-font-smoothing:antialiased;
 background:radial-gradient(900px 400px at 0% 0%,#121a35,transparent 70%),#0b0c10;padding:40px 40px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.ttl{display:flex;align-items:center;gap:18px}
.ttl img{width:56px;height:56px}
h1{font-size:34px;font-weight:750;letter-spacing:-.02em}
h1 span{color:#7aa5ff}
p.sub{font-size:17px;color:#a3aab8;margin-top:4px}
code{font-variant-ligatures:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;color:#cfd6e4;background:#161a24;border:1px solid #262a34;border-radius:8px;padding:9px 14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.t{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid #23262f;background:#14161c}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .l{position:absolute;left:8px;bottom:8px;font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:6px;background:rgba(10,11,15,.72);backdrop-filter:blur(6px);color:#fff;letter-spacing:.005em}
.t .l i{font-style:normal;color:#9db6ff;font-weight:500;margin-left:6px}
.more{grid-column:span 5;border-radius:10px;border:1.5px dashed #2a2f3b;display:flex;align-items:center;justify-content:center;gap:16px;color:#a3aab8;font-size:17px}
</style></head><body>
<header><div class="ttl"><img src="../../assets/logo.svg" alt=""><div><h1>31 templates <span>to start from</span></h1><p class="sub">Every tile is a real headless render of the template, straight from <b style="color:#f2f4f8">agent3d render</b>.</p></div></div>
<code>npx -y @fleox/agent3d@0.2.0 new my-scene --template hero-perfume-luxury</code></header>
<div class="grid" id="g"></div>
<script>
const T=[{"id": "banner-aurora-night", "title": "Aurora night banner", "kind": "banner"}, {"id": "banner-data-bars", "title": "Data bars banner", "kind": "banner"}, {"id": "banner-floating-shapes", "title": "Floating shapes banner", "kind": "banner"}, {"id": "banner-gradient-blob", "title": "Gradient blob banner", "kind": "banner"}, {"id": "banner-liquid-chrome", "title": "Liquid chrome banner", "kind": "banner"}, {"id": "banner-logo-extrude", "title": "Extruded logo banner", "kind": "banner"}, {"id": "banner-neon-title", "title": "Neon title banner", "kind": "banner"}, {"id": "banner-wave-grid", "title": "Wave grid banner", "kind": "banner"}, {"id": "card-hover-3d", "title": "3D product card", "kind": "card"}, {"id": "card-product-tilt", "title": "Product tilt card", "kind": "card"}, {"id": "character-mascot-hero", "title": "Mascot hero", "kind": "hero"}, {"id": "character-showcase", "title": "Character showcase", "kind": "hero"}, {"id": "diorama-city", "title": "Isometric city diorama", "kind": "square"}, {"id": "game-basket", "title": "Hoop shot", "kind": "game"}, {"id": "game-coin-collector", "title": "Coin collector arena", "kind": "game"}, {"id": "game-maze", "title": "Marble maze", "kind": "game"}, {"id": "game-physics-playground", "title": "Tower smash (physics)", "kind": "game"}, {"id": "game-platformer", "title": "Sky platformer", "kind": "game"}, {"id": "game-runner", "title": "Endless runner", "kind": "game"}, {"id": "game-tap-targets", "title": "Tap the targets", "kind": "game"}, {"id": "hero-floating-island", "title": "Floating island hero", "kind": "hero"}, {"id": "hero-perfume-luxury", "title": "Luxury perfume hero", "kind": "hero"}, {"id": "hero-product-turntable", "title": "Product turntable hero", "kind": "hero"}, {"id": "hero-saas-globe", "title": "SaaS globe hero", "kind": "hero"}, {"id": "hero-scroll-story", "title": "Scroll story hero", "kind": "hero"}, {"id": "hero-sneaker-showcase", "title": "Sneaker showcase hero", "kind": "hero"}, {"id": "hero-space-planet", "title": "Space planet hero", "kind": "hero"}, {"id": "landscape-island", "title": "Tropical low-poly island", "kind": "hero"}, {"id": "landscape-night-galaxy", "title": "Night galaxy landscape", "kind": "hero"}, {"id": "landscape-valley-sunset", "title": "Mountain valley at sunset", "kind": "hero"}, {"id": "scene-cozy-room", "title": "Cozy room diorama", "kind": "square"}];
const dir=new URLSearchParams(location.search).get("dir")||"./grid";
const g=document.getElementById("g");
for(const t of T){const d=document.createElement("div");d.className="t";d.innerHTML=`<img src="${dir}/${t.id}.png" alt=""><div class="l">${t.title}<i>${t.kind}</i></div>`;g.appendChild(d)}
const m=document.createElement("div");m.className="more";m.innerHTML="Banners · cards · heroes · characters · dioramas · landscapes · mini games — or start from a blank scene per format";g.appendChild(m);
</script></body></html>
