name: Release

# Push a tag made by `npm version <patch|minor|major>` (vX.Y.Z) to publish
# that version to npm and create the GitHub Release. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing (OIDC, no npm token stored)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          # Shared runners render WebGL in software (SwiftShader): give the browser e2e tests time.
          AGENT3D_CDP_TIMEOUT_MS: "180000"
      - run: npm run check:skills
      - run: npm run check:hermes
      - run: node scripts/build-cli-docs.mjs --check
      - name: CLI smoke test (packed tarball)
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fleox-agent3d-*.tgz
          npx agent3d version --json
          npx agent3d help --json > /dev/null
          npx agent3d new demo --template banner-neon-title --json > /dev/null
          npx agent3d check --project demo --json > /dev/null
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # Idempotent: the very first version was published by hand (npm only
      # allows trusted publishing on an existing package).
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if curl -fsS "https://registry.npmjs.org/@fleox%2fagent3d/$version" >/dev/null 2>&1; then
            echo "@fleox/agent3d@$version is already on npm — skipping publish."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const v = require("./package.json").version;
            const e = require("./changelog.json").versions.find((x) => x.version === v);
            const lines = [];
            if (e?.breaking) lines.push("**Breaking changes — read before updating.**", "");
            lines.push(...(e?.changes ?? []).map((c) => "- " + c));
            if (e?.actions?.length) lines.push("", "After updating:", ...e.actions.map((a) => "- " + a));
            lines.push("", "Install / update: `npx -y @fleox/agent3d@" + v + " help` — Claude Code: `/plugin marketplace update agent3d`.");
            require("fs").writeFileSync("release-notes.md", lines.join("\n") + "\n");
          '
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
