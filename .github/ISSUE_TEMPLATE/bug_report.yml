name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. **Never paste API keys or private assets you are not allowed to share.** Security issues go through [SECURITY.md](https://github.com/fleox/agent3d/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Agent3D version
      description: "The version you ran (`npx -y @fleox/agent3d@<version> version`, or `agent3d` in the project's `agent3d.json`)."
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - agent3d CLI
        - Headless render (render, check --render, posters, videos)
        - Export (embed, zip, single-html, poster, video, gif)
        - The embed on a website (<agent3d-scene>)
        - Studio (visual editor)
        - Studio assistant
        - MCP server
        - An agent skill (Claude Code, Hermes, other)
        - A template
        - AgentCMS block
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser and version (`doctor --json` prints them).
      placeholder: "macOS 15, Node 22.11, Chrome 131"
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, what you got. Include the exact error, or the `--json` output of the command.
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: Scene
      description: The smallest `scene.json` (and script) that shows the problem, or the template id it started from.
      render: json
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or renders, the website or framework the embed runs in, console errors…
