name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to make, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look in `scene.json`, the CLI, the Studio, the MCP server or for an agent (a new behaviour, generator, material, effect, template…).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
